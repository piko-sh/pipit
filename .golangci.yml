version: "2"

run:
  timeout: 10m
  go: "1.27"

linters:
  default: none
  enable:
    - revive
    - staticcheck
    - gocritic
    - gosec
    - godoclint
    - exhaustruct_v5
    - depguard
    - exhaustive
    - govet
    - dupl
    - modernize
    - funcorder
    - goheader
    - decorder
    - misspell
    - errorlint
    - bidichk
    - iotamixing
    - unused
    - prealloc
    - nolintlint

  settings:
    nolintlint:
      allow-unused: false
      require-specific: true
      require-explanation: true

    depguard:
      rules:
        engine-below-everything:
          list-mode: lax
          files:
            - "**/internal/engine/**"
          deny:
            - pkg: pipit.sh/pipit/internal/app
              desc: engine sits below app
            - pkg: pipit.sh/pipit/internal/compile
              desc: engine sits below compile
            - pkg: pipit.sh/pipit/internal/adapters
              desc: engine sits below adapters
            - pkg: pipit.sh/pipit/internal/verify
              desc: engine sits below verify
            - pkg: pipit.sh/pipit/internal/debug
              desc: engine sits below debug
            - pkg: pipit.sh/pipit/internal/codec
              desc: engine sits below codec
        compile-below-app:
          list-mode: lax
          files:
            - "**/internal/compile/**"
          deny:
            - pkg: pipit.sh/pipit/internal/app
              desc: compile sits below app
            - pkg: pipit.sh/pipit/internal/adapters
              desc: compile sits below adapters
            - pkg: pipit.sh/pipit/internal/verify
              desc: compile sits below verify
            - pkg: pipit.sh/pipit/internal/debug
              desc: compile sits below debug
            - pkg: pipit.sh/pipit/internal/codec
              desc: compile sits below codec
        adapters-below-app:
          list-mode: lax
          files:
            - "**/internal/adapters/**"
            - "!$test"
          deny:
            - pkg: pipit.sh/pipit/internal/app
              desc: adapters sit below app
            - pkg: pipit.sh/pipit/internal/compile
              desc: adapters do not reach into the compiler
        symtab-below-engine:
          list-mode: lax
          files:
            - "**/internal/symtab/**"
          deny:
            - pkg: pipit.sh/pipit/internal/engine
              desc: symtab sits below engine
            - pkg: pipit.sh/pipit/internal/compile
              desc: symtab sits below compile
            - pkg: pipit.sh/pipit/internal/app
              desc: symtab sits below app
            - pkg: pipit.sh/pipit/internal/adapters
              desc: symtab sits below adapters
        isa-is-a-leaf:
          list-mode: lax
          files:
            - "**/internal/isa/**"
          deny:
            - pkg: pipit.sh/pipit/internal/symtab
              desc: isa sits below symtab
            - pkg: pipit.sh/pipit/internal/engine
              desc: isa sits below engine
            - pkg: pipit.sh/pipit/internal/compile
              desc: isa sits below compile
            - pkg: pipit.sh/pipit/internal/app
              desc: isa sits below app
        internal-never-imports-sdk:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/cmd/**"
            - "!**/sdk/**"
          deny:
            - pkg: pipit.sh/pipit/sdk
              desc: internal owns the implementation; sdk is the facade over it
        leaves-import-nothing-internal:
          list-mode: lax
          files:
            - "**/internal/fault/**"
            - "**/internal/safeconv/**"
            - "!$test"
          deny:
            - pkg: pipit.sh/pipit/internal
              desc: leaf packages import nothing from the module
    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: waitgroup-by-value
        - name: use-waitgroup-go
        - name: atomic
        - name: unreachable-code
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-switch-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-conditions
        - name: useless-fallthrough
        - name: constant-logical-expr
        - name: range-val-address
        - name: range-val-in-closure
        - name: unchecked-type-assertion
        - name: redefines-builtin-id
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: time-equal
        - name: duplicated-imports
        - name: call-to-gc
        - name: datarace
        - name: unconditional-recursion
        - name: struct-tag
        - name: import-shadowing
        - name: string-of-int
        - name: forbidden-call-in-wg-go
        - name: line-length-limit
          arguments: [ 200 ]
        - name: file-length-limit
          arguments:
            - max: 1000
              skip-comments: true
              skip-blank-lines: true
        - name: function-length
          arguments: [ 90, 60 ]
        - name: argument-limit
          arguments: [ 7 ]
        - name: function-result-limit
          arguments: [ 4 ]
        - name: cyclomatic
          arguments: [ 20 ]
        - name: cognitive-complexity
          arguments: [ 15 ]
        - name: max-public-structs
          arguments: [ 25 ]
        - name: max-control-nesting
          arguments: [ 3 ]
        - name: add-constant
          arguments:
            - max-lit-count: "3"
              allow-strs: "\"\",\"/\",\".\",\"\\n\",\"\\n\\n\""
              allow-ints: "0,1,2,-1"
              allow-floats: "0.0,1.0"
              ignore-funcs: "strconv\\.Parse.*,strconv\\.Format.*,time\\.Date"
        - name: empty-lines
        - name: superfluous-else
        - name: early-return
        - name: indent-error-flow
        - name: unnecessary-stmt
        - name: var-declaration
        - name: comment-spacings
        - name: use-any
        - name: increment-decrement
        - name: bare-return
        - name: bool-literal-in-expr
        - name: empty-block
        - name: var-naming
          arguments: [ [ ], [ ], [ { "skip-initialism-name-checks": false, "skip-package-name-checks": true } ] ]
        - name: receiver-naming
        - name: error-naming
        - name: exported
          arguments: [ "disableStutteringCheck" ]
        - name: package-comments
        - name: package-directory-mismatch
        - name: time-naming
        - name: unhandled-error
          arguments:
            - "^fmt\\.Fprintf$"
            - "^fmt\\.Fprintln$"
            - "^fmt\\.Println$"
            - "^fmt\\.Printf$"
            - "^strings\\.Builder\\.WriteString$"
            - "^strings\\.Builder\\.WriteByte$"
            - "^strings\\.Builder\\.Write$"
            - "^os\\.File\\.Close$"
        - name: error-strings
        - name: blank-imports
        - name: dot-imports
        - name: unused-parameter
        - name: unused-receiver
        - name: confusing-results
        - name: unexported-return
        - name: modifies-parameter
        - name: confusing-naming
          disabled: true
        - name: modifies-value-receiver
        - name: use-slices-sort
        - name: epoch-naming
        - name: use-errors-new
        - name: use-fmt-print
        - name: unnecessary-format
        - name: unnecessary-if
        - name: if-return
        - name: useless-break
        - name: redundant-import-alias
        - name: redundant-build-tag
        - name: redundant-test-main-exit
        - name: inefficient-map-lookup
        - name: time-date
        - name: range
        - name: optimize-operands-order

    modernize:
      disable:
        - embedlit

    misspell:
      locale: UK
      mode: "restricted"
      ignore-rules:
        - color
        - center
        - initialize
        - initialized

    gocritic:
      enable-all: true
      disabled-tags:
        - opinionated
        - style
      settings:
        hugeParam:
          sizeThreshold: 256

    gosec:
      excludes:
        - G103
        - G117
        - G402
        - G704
        - G705

    godoclint:
      default: all
      disable:
        - require-stdlib-doclink
        - single-pkg-doc
      options:
        max-len:
          length: 90
        start-with-name:
          include-unexported: true

    govet:
      enable:
        - fieldalignment

    exhaustive:
      default-signifies-exhaustive: true

    exhaustruct_v5:
      allow-empty-returns: true

    goheader:
      template: |-
        Copyright 2026 PolitePixels Limited

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.

    decorder:
      dec-order:
        - const
        - var
      disable-dec-order-check: false
      disable-init-func-first-check: true
      disable-dec-num-check: true
      ignore-underscore-vars: true

    dupl:
      threshold: 100

  exclusions:
    generated: strict

    paths:
      - third_party
      - vendor
      - node_modules
      - examples
      - tests/bench/cross_language/benchmarks

    rules:
      - path: ^(internal/sandboxhost/filesystem(_recovery)?|isolated)\.go$
        linters: [ gocritic ]
        text: "hugeParam: config is heavy"

      - path: ^internal/compile/(reflect_type_for|compiler_linked_calls)\.go$
        linters: [ modernize ]
        text: "reflecttypefor|reflecttypeassert"

      - path: _test\.go$
        linters:
          - gocritic
          - gosec
          - godoclint
          - funcorder
          - dupl
          - exhaustruct_v5
          - goheader
          - decorder
          - unused

      - path: _test\.go$
        linters: [ staticcheck ]
        text: "QF1011|SA1012|SA1029|S1040|SA2001"

      - path: _test\.go$
        linters: [ revive ]
        text: "call-to-gc|line-length-limit|file-length-limit|function-length|argument-limit|function-result-limit|cyclomatic|cognitive-complexity|max-public-structs|max-control-nesting|empty-lines|superfluous-else|early-return|indent-error-flow|unnecessary-stmt|var-declaration|comment-spacings|use-any|increment-decrement|bare-return|bool-literal-in-expr|empty-block|var-naming|receiver-naming|error-naming|exported|package-comments|package-directory-mismatch|time-naming|unhandled-error|error-strings|blank-imports|dot-imports|unused-parameter|unused-receiver|confusing-results|unexported-return|modifies-parameter|confusing-naming|modifies-value-receiver|add-constant|use-slices-sort|epoch-naming|use-errors-new|use-fmt-print|unnecessary-format|unnecessary-if|if-return|useless-break|redundant-import-alias|redundant-build-tag|redundant-test-main-exit|inefficient-map-lookup|time-date|range|optimize-operands-order|struct-tag|context-as-argument"

      - path: testdata/
        linters: [ revive ]
        text: "line-length-limit|file-length-limit|function-length|argument-limit|function-result-limit|cyclomatic|cognitive-complexity|max-public-structs|max-control-nesting|empty-lines|superfluous-else|early-return|indent-error-flow|unnecessary-stmt|var-declaration|comment-spacings|use-any|increment-decrement|bare-return|bool-literal-in-expr|empty-block|var-naming|receiver-naming|error-naming|exported|package-comments|package-directory-mismatch|time-naming|unhandled-error|error-strings|blank-imports|dot-imports|unused-parameter|unused-receiver|confusing-results|unexported-return|modifies-parameter|confusing-naming|modifies-value-receiver|add-constant|use-slices-sort|epoch-naming|use-errors-new|use-fmt-print|unnecessary-format|unnecessary-if|if-return|useless-break|redundant-import-alias|redundant-build-tag|redundant-test-main-exit|inefficient-map-lookup|time-date|range|optimize-operands-order|context-as-argument"

      # decorder mislabels its desired order ("const,var,var,func") and raises this even
      # on a var block that directly follows the imports, as in bytecode.go, so the
      # message carries no signal. The const-first rule it sits beside is enforced.
      - linters: [ decorder ]
        text: "var must not be placed after var"

      - path: _test\.go$
        linters: [ govet ]
        text: "fieldalignment"

      - path: internal/engine/program/function\.go$
        linters: [ govet ]
        text: "fieldalignment: CompiledFunction"
      - path: internal/engine/vm\.go$
        linters: [ govet ]
        text: "fieldalignment: RuntimeClosure"

      - linters: [ exhaustruct_v5 ]
        text: "^(asmgen|reflect|packages|types|ast|token|constant|http|tls|x509|exec|os|flag|slog|log|template|json|xml|testing|flatbuffers|goleak|require|assert|dap|unix|syscall|sync|atomic|time|context|io|bufio|bytes|strings|net|url|sort|regexp|elf|debug|cmp|iter|maps|slices|errors|fmt)\\.[A-Za-z0-9_]+ is missing"

      - path: internal/engine/
        linters: [ govet ]
        text: "unsafeptr"

      - linters: [ dupl ]
        path: "internal/engine/asm/"

      - path: (internal/engine/asm/asmgen_arch_amd64|internal/engine/asm/asmgen_arch_arm64)/
        linters: [ revive ]
        text: "add-constant"

      - linters: [ exhaustive ]
        text: 'switch of type (reflect\.Kind|reflect\.ChanDir|isa\.Opcode|isa\.SubOpcode|isa\.SubOpcodeTier2|token\.Token|types\.BasicKind|types\.SelectionKind|constant\.Kind)'

      - path: _test\.go$
        linters: [ exhaustive ]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

output:
  formats:
    text:
      path: stdout
      colors: true
  sort-order:
    - linter
    - file
