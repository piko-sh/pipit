# pipit-symbols-stdlib.yaml - Symbol extraction manifest for the standard library.
#
# Lists the Go standard-library packages whose symbols are vendored into sdk/stdlib for
# native-speed access via reflect.Value.Call(). hack/generate/symbols.sh splits them into
# the sdk/stdlib bundles and overrides package and output for each one.
# Regenerate with: make generate-symbols

package: stdlib
output: sdk/stdlib

# These files are emitted into pipit's own internal tree, so they import the link
# sentinels by their internal path rather than the public sdk facade above them.
link_import_path: pipit.sh/pipit/internal/link

packages:
  - bufio
  - bytes
  - archive/tar
  - archive/zip
  - compress/bzip2
  - compress/flate
  - compress/gzip
  - compress/lzw
  - compress/zlib
  - container/heap
  - container/list
  - container/ring
  - context
  - crypto
  - crypto/aes
  - crypto/cipher
  - crypto/des
  - crypto/dsa
  - crypto/ecdh
  - crypto/ecdsa
  - crypto/ed25519
  - crypto/elliptic
  - crypto/fips140
  - crypto/hkdf:
      generic_functions:
        Key: [["hash.Hash"]]
        Extract: [["hash.Hash"]]
        Expand: [["hash.Hash"]]
  - crypto/hmac
  - crypto/hpke
  - crypto/mldsa
  - crypto/mlkem
  - crypto/mlkem/mlkemtest
  - crypto/pbkdf2:
      generic_functions:
        Key: [["hash.Hash"]]
  - crypto/rc4
  - crypto/rsa
  - crypto/sha3
  - crypto/subtle
  - crypto/tls
  - crypto/x509
  - crypto/x509/pkix
  - crypto/md5
  - crypto/rand
  - crypto/sha1
  - crypto/sha256
  - crypto/sha512
  - database/sql
  - database/sql/driver
  - debug/buildinfo
  - debug/dwarf
  - debug/elf
  - debug/gosym
  - debug/macho
  - debug/pe
  - debug/plan9obj
  - embed
  - encoding
  - encoding/ascii85
  - encoding/asn1
  - encoding/base32
  - encoding/base64
  - encoding/binary
  - encoding/csv
  - encoding/gob
  - encoding/hex
  - encoding/json
  # jsontext's AppendQuote / AppendUnquote / AppendFormat are generic over
  # ~[]byte | ~string, a union constraint the extractor's wrapper codegen cannot render.
  # They are registered by hand instead, in wrapped_encoding_json_jsontext.go.
  - encoding/json/jsontext
  - encoding/json/v2
  - encoding/pem
  - encoding/xml
  - errors
  - expvar
  - flag
  - fmt
  - go/ast
  - go/build
  - go/build/constraint
  - go/constant
  - go/doc
  - go/doc/comment
  - go/format
  - go/importer
  - go/parser
  - go/printer
  - go/scanner
  - go/token
  - go/types
  - go/version
  - hash
  - hash/adler32
  - hash/crc32
  - hash/crc64
  - hash/fnv
  # ComparableHasher, new in Go 1.27, is deliberately not opted into the native-backed
  # generic pipeline: that pipeline erases the type argument to struct{}, which works only
  # when the parameter appears behind a pointer (as in atomic.Pointer). ComparableHasher
  # takes its T by value, so its methods stay uncallable from interpreted code either way.
  - hash/maphash
  - html
  - html/template
  - image
  - image/color
  - image/color/palette
  - image/draw
  - image/gif
  - image/jpeg
  - image/png
  - index/suffixarray
  - io
  - io/fs
  - io/ioutil
  - iter
  - log
  - log/slog
  - log/syslog:
      build_tag: "!windows && !plan9"
  - math
  - math/big
  - math/bits
  - math/cmplx
  - math/rand
  - math/rand/v2
  - mime
  - mime/multipart
  - mime/quotedprintable
  - net
  - net/http
  - net/http/cgi
  - net/http/cookiejar
  - net/http/fcgi
  - net/http/httptest
  - net/http/httptrace
  - net/http/httputil
  - net/http/pprof
  - net/mail
  - net/netip
  - net/rpc
  - net/rpc/jsonrpc
  - net/smtp
  - net/textproto
  - net/url
  - os
  - os/exec
  - os/signal
  - os/user
  - path
  - path/filepath
  - reflect
  - regexp
  - regexp/syntax
  - runtime
  - runtime/debug
  - runtime/metrics
  - runtime/pprof
  - sort
  - strconv
  - strings
  - structs
  - sync:
      generic_functions:
        OnceValue: [[int]]
        OnceValues: [[int, error]]
  - sync/atomic:
      generic_types:
        Pointer: ["struct{}"]
  - testing
  - testing/cryptotest
  - testing/fstest
  - testing/iotest
  - testing/quick
  - testing/slogtest
  - testing/synctest
  - text/scanner
  - text/tabwriter
  - text/template
  - text/template/parse
  - time
  - time/tzdata
  - unicode
  - unicode/utf16
  - unicode/utf8
  - unique
  - uuid
  - weak
  # slices, maps, cmp: primitive types stay on fast monomorphised
  # switch-case dispatch; non-enumerated element types fall through to
  # the hand-written reflective fallbacks in wrapped_generic_fallbacks.go
  # (reflectSlicesSort, reflectCmpCompare, etc.). Expand element lists
  # to cover types likely to be hot enough for fast-path inlining.
  - slices:
      element_types: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64, bool]
      functions:
        BinarySearch: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64]
        Compare: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64]
        IsSorted: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64]
        Max: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64]
        Min: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64]
        Sort: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64]
  - maps:
      key_types: [string, int, int32, int64]
      value_types: [string, int, int32, int64, float64, bool, any]
  - cmp:
      element_types: [string, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float32, float64]
